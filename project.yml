name: JevJarvis
options:
  bundleIdPrefix: com.jevchat
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "5"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: XZWGHPX856
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"
    GENERATE_INFOPLIST_FILE: false

targets:
  JevJarvis:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Assets.xcassets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jevchat.jarvis.ios
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/JevJarvis.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 秒回
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: App/JevJarvis.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.jevchat.jarvis.ios
    dependencies:
      - target: JevKeyboard
      - target: JevLive

  JevKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard/Sources
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jevchat.jarvis.ios.keyboard
        INFOPLIST_FILE: Keyboard/Info.plist
        CODE_SIGN_ENTITLEMENTS: Keyboard/JevKeyboard.entitlements
        SKIP_INSTALL: true
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: 秒回键盘
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSExtension:
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: zh-Hans
            RequestsOpenAccess: true
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
    entitlements:
      path: Keyboard/JevKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.jevchat.jarvis.ios

  # 直播模式（实验）：ReplayKit 广播上传扩展。录屏 → 本地 OCR → 快照写 App Group。
  # 只挂 Shared/JevLive.swift 一个共享文件，别把整条管线拖进 50MB 内存上限的进程。
  JevLive:
    type: app-extension
    platform: iOS
    sources:
      - path: Broadcast/Sources
      - path: Shared/JevLive.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jevchat.jarvis.ios.live
        INFOPLIST_FILE: Broadcast/Info.plist
        CODE_SIGN_ENTITLEMENTS: Broadcast/JevLive.entitlements
        SKIP_INSTALL: true
    info:
      path: Broadcast/Info.plist
      properties:
        CFBundleDisplayName: 秒回直播
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).LiveBroadcastHandler
    entitlements:
      path: Broadcast/JevLive.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.jevchat.jarvis.ios
