name: JevJarvis
options:
  bundleIdPrefix: com.jevchat
  # 派生数据(DerivedData) 写到 D 盘，避免占用 Mac 系统卷（等效 Windows C 盘）。
  # 路径即 Windows D 盘在 macOS(Boot Camp 双系统)下的挂载点。
  derivedDataPath: /Volumes/D/jev-ios-cache/DerivedData
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "5"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    # Team ID 由环境变量 JEV_TEAM_ID 注入（build.sh 默认 75LZ93U5CF 上游占位，需替换成你自己的）。
    DEVELOPMENT_TEAM: ${ENV:JEV_TEAM_ID}
    CURRENT_PROJECT_VERSION: "2"
    MARKETING_VERSION: "0.1.0"
    GENERATE_INFOPLIST_FILE: false
    # —— 构建缓存统一落到 D 盘 ——
    # 可用环境变量覆盖根：构建前 export JEV_CACHE_ROOT=/your/volume/jev-ios-cache
    SYMROOT: /Volumes/D/jev-ios-cache/Build/Products
    OBJROOT: /Volumes/D/jev-ios-cache/Build/Intermediates
    DERIVED_DATA_PATH: /Volumes/D/jev-ios-cache/DerivedData
    SHARED_PRECOMPS_DIR: /Volumes/D/jev-ios-cache/Build/Precompiled

targets:
  JevJarvis:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Assets.xcassets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jevchat.jarvis
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: App/Info.plist
        # entitlements 路径由 build.sh 经 JEV_APP_ENTITLEMENTS 注入（付费=带 App Group，免费=空）。
        CODE_SIGN_ENTITLEMENTS: ${ENV:JEV_APP_ENTITLEMENTS}
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Jev Jarvis
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: ${ENV:JEV_APP_ENTITLEMENTS}
    dependencies:
      - target: JevKeyboard

  JevKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard/Sources
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jevchat.jarvis.keyboard
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Keyboard/Info.plist
        CODE_SIGN_ENTITLEMENTS: ${ENV:JEV_KB_ENTITLEMENTS}
        SKIP_INSTALL: true
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: Jev 键盘
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSExtension:
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            # PrimaryLanguage 必须有值(缺失会让键盘弹起时宿主直接崩),但也不能用 zh-Hans:
            # 审核环境(英文系统/听写语言未启用)查 zh-Hans 的听写语言拿到 nil,系统 TextInput
            # 会以 setObject:forKey: 传 nil 把宿主 App 崩掉(2026-09-23 真机 6 连崩实证)。
            # en-US 的听写元数据所有设备都有,规避这条系统 bug;键盘 UI 本身仍是中文。
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
    entitlements:
      path: ${ENV:JEV_KB_ENTITLEMENTS}

  JevJarvisUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jevchat.jarvis.uitests
        TEST_TARGET_NAME: JevJarvis
        GENERATE_INFOPLIST_FILE: true
        SKIP_INSTALL: true
    dependencies:
      - target: JevJarvis

schemes:
  JevJarvis:
    build:
      targets:
        JevJarvis: all
        JevJarvisUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - JevJarvisUITests
  JevKeyboard:
    build:
      targets:
        JevKeyboard: all
