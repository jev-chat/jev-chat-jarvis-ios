<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1600px; height: 2490px; }
    body { padding: 72px; background: #e9eef1; color: #1b2a30; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    h1 { margin: 0 0 22px; font-size: 43px; letter-spacing: 0; }
    .section { margin-bottom: 72px; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px; }
    img { display: block; width: 100%; border: 1px solid #cfd8dd; }
  </style>
</head>
<body>
  <div class="section">
    <h1>简体中文</h1>
    <div class="grid"><img src="zh-Hans/01-tones.png"><img src="zh-Hans/02-models.png"><img src="zh-Hans/03-home.png"></div>
  </div>
  <div class="section">
    <h1>English</h1>
    <div class="grid"><img src="en/01-tones.png"><img src="en/02-models.png"><img src="en/03-home.png"></div>
  </div>
</body>
</html>
